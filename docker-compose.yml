version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: lifememory_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: lifememory
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lifememory_backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@db:5432/lifememory
      - SECRET_KEY=super-secret-life-memory-key-for-dev-only
      - AI_PROVIDER=mock
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

volumes:
  pgdata:

