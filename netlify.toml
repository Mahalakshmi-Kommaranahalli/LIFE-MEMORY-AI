# Netlify configuration for LIFE MEMORY AI
[build]
  publish = "frontend"
  # No build command needed for plain HTML/JS frontend
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
